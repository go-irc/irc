name: CI

# Because "push" also shows up on PRs, we don't need to do both.
on: [push]

jobs:
  build-1_13:
    name: Build (Go 1.13)
    runs-on: ubuntu-latest

    steps:
    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: '~1.13.5'

    - name: Check out code
      uses: actions/checkout@v2
      with:
        submodules: true

    - name: Clean up extra files
      run: rm ./_testcases/*.go

    - name: Download deps
      run: go mod download

    - name: Run tests
      run: go test -race -v ./...

  build-latest:
    name: Build (Latest)
    runs-on: ubuntu-latest

    steps:
    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: '~1.19'

    - name: Check out code
      uses: actions/checkout@v2
      with:
        submodules: true

    - name: Clean up extra files
      run: rm ./_testcases/*.go

    - name: Download deps
      run: go mod download

    - name: Run tests
      run: go test -covermode=atomic -coverprofile=profile.cov -race -v ./...

    - name: Submit coverage report
      uses: coverallsapp/github-action@v2
      with:
        file: profile.cov
        format: golang

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: '~1.19'

    - name: Check out code
      uses: actions/checkout@v2

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v2
      with:
        version: 'v1.49.0'
        skip-go-installation: true
